<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Fonte de Saber</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0a1628; --blue:#1a3a6e; --accent:#00c8a0;
      --white:#fff; --text:#2d3748; --muted:#718096;
      --border:#e2e8f0; --red:#e53e3e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'DM Sans',sans-serif; background:var(--navy);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    body::before {
      content:''; position:absolute; width:600px; height:600px;
      background:radial-gradient(circle,rgba(0,200,160,.15) 0%,transparent 70%);
      top:-200px; right:-200px; border-radius:50%;
      animation:pulse 4s ease-in-out infinite;
    }
    body::after {
      content:''; position:absolute; width:400px; height:400px;
      background:radial-gradient(circle,rgba(26,58,110,.4) 0%,transparent 70%);
      bottom:-100px; left:-100px; border-radius:50%;
      animation:pulse 4s ease-in-out infinite reverse;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.1);opacity:1} }
    .card {
      background:var(--white); border-radius:24px; width:100%;
      max-width:420px; padding:40px;
      box-shadow:0 30px 80px rgba(0,0,0,.4);
      position:relative; z-index:1; animation:slideUp .4s ease;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    .logo-section { text-align:center; margin-bottom:28px; }
    .logo-placeholder {
      width:70px; height:70px; border-radius:50%; background:var(--navy);
      border:3px solid var(--accent); display:flex; align-items:center;
      justify-content:center; font-size:28px; margin:0 auto 12px;
    }
    .logo-section h1 { font-family:'Playfair Display',serif; font-size:20px; color:var(--navy); line-height:1.3; }
    .logo-section p { color:var(--muted); font-size:13px; margin-top:4px; }

    /* Flash messages */
    .flash-erro {
      background:#fff5f5; border:2px solid var(--red); border-radius:8px;
      padding:10px 14px; color:var(--red); font-size:13px; font-weight:600;
      text-align:center; margin-bottom:16px;
    }
    .flash-sucesso {
      background:#f0fdf9; border:2px solid var(--accent); border-radius:8px;
      padding:10px 14px; color:#065f46; font-size:13px; font-weight:600;
      text-align:center; margin-bottom:16px;
    }

    /* Tabs */
    .auth-tabs { display:flex; background:#f0f4f8; border-radius:10px; padding:4px; margin-bottom:24px; }
    .auth-tab {
      flex:1; padding:10px; text-align:center; border-radius:8px;
      cursor:pointer; font-weight:600; font-size:14px; color:var(--muted); transition:all .2s;
    }
    .auth-tab.active { background:var(--white); color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .form { display:none; }
    .form.active { display:block; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .form-group { margin-bottom:16px; }
    .form-group label {
      display:block; font-size:12px; text-transform:uppercase;
      letter-spacing:1px; color:var(--muted); font-weight:600; margin-bottom:6px;
    }
    .form-group input,
    .form-group select {
      width:100%; padding:12px 16px; border:2px solid var(--border);
      border-radius:10px; font-family:'DM Sans',sans-serif; font-size:15px;
      outline:none; transition:border-color .2s; color:var(--text);
    }
    .form-group input:focus, .form-group select:focus { border-color:var(--accent); }
    .input-icon { position:relative; }
    .input-icon input { padding-right:44px; }
    .input-icon .icon {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      cursor:pointer; color:var(--muted); font-size:16px; user-select:none;
    }
    .btn-primary {
      width:100%; padding:14px; background:var(--navy); color:var(--white);
      border:none; border-radius:10px; font-family:'DM Sans',sans-serif;
      font-size:16px; font-weight:700; cursor:pointer;
      transition:background .2s,transform .1s; margin-top:8px;
    }
    .btn-primary:hover { background:var(--blue); }
    .btn-primary:active { transform:scale(.98); }
    footer { text-align:center; margin-top:20px; color:rgba(255,255,255,.4); font-size:12px; position:relative; z-index:1; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-section">
    <div class="logo-placeholder">🏫</div>
    <h1>Complexo Escolar Privado<br>Fonte de Saber</h1>
    <p>Sistema de Gestão Escolar</p>
  </div>

  <!-- Mensagens Flask -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% if erro %}
    <div class="flash-erro">❌ {{ erro }}</div>
  {% endif %}

  <div class="auth-tabs">
    <div class="auth-tab active" onclick="showTab('login')">🔐 Entrar</div>
    <div class="auth-tab" onclick="showTab('cadastro')">📝 Cadastrar</div>
  </div>

  <!-- LOGIN -->
  <div class="form active" id="form-login">
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="exemplo@escola.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <div class="input-icon">
          <input type="password" name="senha" id="loginSenha" placeholder="••••••••" required>
          <span class="icon" onclick="toggle('loginSenha',this)">👁</span>
        </div>
      </div>
      <button type="submit" class="btn-primary">Entrar no Sistema</button>
    </form>
  </div>

  <!-- CADASTRO -->
  <div class="form" id="form-cadastro">
    <form method="POST" action="/cadastrar">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" name="nome" placeholder="Nome do funcionário" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="exemplo@escola.com" required>
      </div>
      <div class="form-group">
        <label>Cargo</label>
        <select name="cargo" required>
          <option value="">-- Selecionar --</option>
          <option>Secretária</option>
          <option>Director Pedagógico</option>
          <option>Director</option>
        </select>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <div class="input-icon">
          <input type="password" name="senha" id="cadSenha" placeholder="Mínimo 6 caracteres" required>
          <span class="icon" onclick="toggle('cadSenha',this)">👁</span>
        </div>
      </div>
      <div class="form-group">
        <label>Confirmar Senha</label>
        <div class="input-icon">
          <input type="password" name="confirmar" id="cadConf" placeholder="Repita a senha" required>
          <span class="icon" onclick="toggle('cadConf',this)">👁</span>
        </div>
      </div>
      <button type="submit" class="btn-primary">Criar Conta</button>
    </form>
  </div>
</div>

<footer>Cread by: Shadow Walker!</footer>

<script>
  function showTab(t) {
    document.querySelectorAll('.auth-tab').forEach((el,i) =>
      el.classList.toggle('active', ['login','cadastro'][i] === t));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.getElementById('form-'+t).classList.add('active');
  }
  function toggle(id, icon) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.textContent = inp.type === 'password' ? '👁' : '🙈';
  }
</script>
</body>
</html>
