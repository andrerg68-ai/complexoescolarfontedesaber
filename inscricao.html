<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Inscrição – Fonte de Saber</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0a1628; --blue:#1a3a6e; --accent:#00c8a0;
      --white:#fff; --bg:#f0f4f8; --text:#2d3748;
      --muted:#718096; --border:#e2e8f0; --red:#e53e3e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }
    header {
      background:var(--navy); padding:16px 32px;
      display:flex; align-items:center; gap:16px;
      box-shadow:0 4px 20px rgba(0,0,0,.3);
    }
    header .logo { font-size:32px; }
    header h1 { font-family:'Playfair Display',serif; color:var(--white); font-size:18px; line-height:1.3; }
    header h1 span { color:var(--accent); }
    .container { max-width:760px; margin:0 auto; padding:40px 20px; }
    .card {
      background:var(--white); border-radius:20px;
      padding:36px; box-shadow:0 4px 24px rgba(0,0,0,.08);
      margin-bottom:24px;
    }
    .card h2 {
      font-family:'Playfair Display',serif; font-size:20px;
      color:var(--navy); margin-bottom:20px;
      padding-bottom:12px; border-bottom:2px solid var(--border);
    }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .full { grid-column:1/-1; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label {
      font-size:11px; text-transform:uppercase; letter-spacing:1px;
      color:var(--muted); font-weight:600;
    }
    .form-group input,
    .form-group select {
      padding:11px 14px; border:2px solid var(--border);
      border-radius:10px; font-family:'DM Sans',sans-serif;
      font-size:14px; color:var(--text); outline:none;
      transition:border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color:var(--accent); }

    /* Tabela de pagamento */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th {
      background:var(--navy); color:var(--white);
      padding:10px 14px; font-size:13px; text-align:left;
    }
    td { padding:8px 14px; border-bottom:1px solid var(--border); }
    td input, td select {
      width:100%; padding:8px 10px; border:1px solid var(--border);
      border-radius:8px; font-size:13px; outline:none;
    }

    .btn-submit {
      width:100%; padding:16px; background:var(--navy);
      color:var(--white); border:none; border-radius:12px;
      font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700;
      cursor:pointer; transition:background .2s, transform .1s;
      margin-top:8px; letter-spacing:.5px;
    }
    .btn-submit:hover { background:var(--blue); }
    .btn-submit:active { transform:scale(.99); }
    .back { display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-weight:600; }
    .back:hover { text-decoration:underline; }
    footer { text-align:center; padding:24px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🏫</div>
  <h1>Complexo Escolar Privado<br><span>Fonte de Saber</span></h1>
</header>

<div class="container">
  <a href="/" class="back">← Voltar</a>

  <form action="/salvar" method="POST" enctype="multipart/form-data">

    <!-- DADOS PESSOAIS -->
    <div class="card">
      <h2>👤 Dados Pessoais</h2>
      <div class="grid">
        <div class="form-group full">
          <label>Nome Completo</label>
          <input type="text" name="nome" placeholder="Nome completo do aluno" required>
        </div>
        <div class="form-group">
          <label>Data de Nascimento</label>
          <input type="date" name="data_nascimento" required>
        </div>
        <div class="form-group">
          <label>Fotografia (JPG)</label>
          <input type="file" name="fotografia" accept=".jpg,.jpeg,.png">
        </div>
        <div class="form-group full">
          <label>Morada</label>
          <input type="text" name="morada" placeholder="Bairro, Município" required>
        </div>
        <div class="form-group">
          <label>Nome do Encarregado</label>
          <input type="text" name="encarregado" placeholder="Nome completo" required>
        </div>
        <div class="form-group">
          <label>Contacto</label>
          <input type="tel" name="contacto" placeholder="9XX XXX XXX" required>
        </div>
        <div class="form-group full">
          <label>Email</label>
          <input type="email" name="email" placeholder="exemplo@email.com" required>
        </div>
      </div>
    </div>

    <!-- DADOS ACADÉMICOS -->
    <div class="card">
      <h2>📚 Dados Académicos</h2>
      <div class="grid">
        <div class="form-group">
          <label>Classe</label>
          <select name="classe" required>
            <option value="">-- Selecionar --</option>
            <option>Iniciação</option>
            <option>1ª</option><option>2ª</option><option>3ª</option>
            <option>4ª</option><option>5ª</option><option>6ª</option>
            <option>7ª</option><option>8ª</option><option>9ª</option>
            <option>10ª</option><option>11ª</option><option>12ª</option><option>13ª</option>
          </select>
        </div>
        <div class="form-group">
          <label>Curso</label>
          <select name="curso" required>
            <option value="">-- Selecionar --</option>
            <option>Nenhum</option>
            <option>Gestão de Sistemas Informáticos</option>
            <option>Gestão Empresarial</option>
            <option>Engenharia e Instalações Eléctricas</option>
            <option>Electrónica e Telecomunicação</option>
            <option>Análises Clínicas</option>
            <option>Estomatologia</option>
            <option>Saúde Ambiental</option>
            <option>Nutrição</option>
            <option>Farmácia</option>
          </select>
        </div>
        <div class="form-group">
          <label>Turma</label>
          <select name="turma" required>
            <option value="">-- Selecionar --</option>
            <option>A</option><option>B</option><option>C</option><option>D</option>
          </select>
        </div>
        <div class="form-group">
          <label>Turno</label>
          <select name="turno" required>
            <option value="">-- Selecionar --</option>
            <option>Manhã</option><option>Tarde</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Histórico Escolar</label>
          <select name="historico" required>
            <option value="">-- Selecionar --</option>
            <option>Mau</option><option>Bom</option>
            <option>Óptimo</option><option>Excelente</option>
          </select>
        </div>
      </div>
    </div>

    <!-- DADOS DA MATRÍCULA -->
    <div class="card">
      <h2>💳 Dados da Matrícula</h2>
      <div class="grid">
        <div class="form-group">
          <label>Método de Pagamento</label>
          <select name="pagamento" required>
            <option value="">-- Selecionar --</option>
            <option>Transferência Bancária</option>
            <option>Multicaixa</option>
            <option>Dinheiro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status do Pagamento</label>
          <select name="status_pagamento">
            <option value="Pendente">Pendente</option>
            <option value="Pago">Pago</option>
          </select>
        </div>
      </div>

      <br>
      <label style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;">
        Histórico de Pagamento (Opcional)
      </label>
      <div class="table-wrap" style="margin-top:10px;">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Valor (Kz)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="date" name="data_pagamento"></td>
              <td><input type="text" name="descricao" placeholder="Ex: Inscrição"></td>
              <td><input type="number" name="valor" placeholder="Ex: 15000" min="0"></td>
              <td>
                <select name="status_pagamento_hist">
                  <option value="">--</option>
                  <option>Pago</option>
                  <option>Pendente</option>
                  <option>Cancelado</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <button type="submit" class="btn-submit">✅ Enviar Inscrição</button>
  </form>
</div>

<footer>Cread by: Shadow Walker!</footer>
</body>
</html>
